name: AppFolio → Calendar Sync

on:
  schedule:
    # NOTE: the RUN_MODE expression below matches the nightly cron string
    # VERBATIM — keep the two in sync if this line ever changes.
    - cron: '15 8 * * *'      # nightly full_nightly (~2-3am Central): dirs + ACL refresh
    - cron: '0 * 6-31 * *'    # hourly full sweep, days 6 → month-end
    - cron: '*/30 * 1-5 * *'  # every 30 min, rent week (days 1-5)
  workflow_dispatch:            # manual triggers (GitHub UI / Calendar add-on)
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'update'
        type: choice
        options: [submit, update, full]

# Serialize ALL runs (cron + manual): concurrent state.json writes are
# impossible, and repeated manual clicks coalesce into one queued run.
# Never cancel a run mid-flight — a cancelled run could leave state.json
# half-written and unpushed; we queue instead.
concurrency:
  group: pm-calendar-sync
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # suppress Node.js 20 deprecation warning

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to commit state.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Always check out the CURRENT tip of main, not the SHA frozen when
          # this run was created.  A scheduled run queued behind an in-flight
          # run (concurrency group) would otherwise execute against the
          # pre-queue state.json and repeat calendar writes the finished run
          # already made (2026-08-02: duplicated promise mirrors).
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          APPFOLIO_DB_NAME:              ${{ secrets.APPFOLIO_DB_NAME }}
          APPFOLIO_CLIENT_ID:            ${{ secrets.APPFOLIO_CLIENT_ID }}
          APPFOLIO_CLIENT_SECRET:        ${{ secrets.APPFOLIO_CLIENT_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON:   ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PM_EMAIL:                      ${{ secrets.PM_EMAIL }}
          LATE_GRACE_DAYS:               ${{ vars.LATE_GRACE_DAYS               || '5' }}
          DEFAULT_LEASE_MONTHS:          ${{ vars.DEFAULT_LEASE_MONTHS          || '12' }}
          COMMITMENT_LOOKAHEAD_MONTHS:   ${{ vars.COMMITMENT_LOOKAHEAD_MONTHS   || '3' }}
          TIMEZONE:                      ${{ vars.TIMEZONE                      || 'America/Chicago' }}
          FORCE_REFRESH:                 ${{ vars.FORCE_REFRESH                 || 'false' }}
          DEPARTED_MAX_PER_RUN:          ${{ vars.DEPARTED_MAX_PER_RUN          || '10' }}
          # Dispatch uses its input; the nightly cron (string must match the
          # schedule entry above verbatim) is full_nightly; other crons: full.
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '15 8 * * *' && 'full_nightly' || 'full') }}
        run: python sync.py

      - name: Commit updated state
        run: |
          git config user.name "okpm-sync-bot"
          git config user.email "bot@okpm.local"
          git add state.json cache/
          if git diff --cached --quiet; then
            echo "No state changes — skipping commit/push."
            exit 0
          fi
          git commit -m "chore: update sync state [skip ci]"
          git pull --rebase origin main
          git push