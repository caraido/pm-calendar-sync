name: AppFolio → Calendar Sync

on:
  schedule:
    - cron: '*/30 * * * *'    # every 30 min normally
    - cron: '*/15 1-5 * * *'  # every 15 min on days 1-5 of month (rent week)
  workflow_dispatch:            # manual trigger button in GitHub UI

# Serialize ALL runs (cron + manual): concurrent state.json writes are
# impossible, and repeated manual clicks coalesce into one queued run.
# Never cancel a run mid-flight — a cancelled run could leave state.json
# half-written and unpushed; we queue instead.
concurrency:
  group: pm-calendar-sync
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # suppress Node.js 20 deprecation warning

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to commit state.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          APPFOLIO_DB_NAME:              ${{ secrets.APPFOLIO_DB_NAME }}
          APPFOLIO_CLIENT_ID:            ${{ secrets.APPFOLIO_CLIENT_ID }}
          APPFOLIO_CLIENT_SECRET:        ${{ secrets.APPFOLIO_CLIENT_SECRET }}
          GOOGLE_SERVICE_ACCOUNT_JSON:   ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          PM_EMAIL:                      ${{ secrets.PM_EMAIL }}
          LATE_GRACE_DAYS:               ${{ vars.LATE_GRACE_DAYS               || '5' }}
          DEFAULT_LEASE_MONTHS:          ${{ vars.DEFAULT_LEASE_MONTHS          || '12' }}
          COMMITMENT_LOOKAHEAD_MONTHS:   ${{ vars.COMMITMENT_LOOKAHEAD_MONTHS   || '3' }}
          TIMEZONE:                      ${{ vars.TIMEZONE                      || 'America/Chicago' }}
          FORCE_REFRESH:                 ${{ vars.FORCE_REFRESH                 || 'false' }}
        run: python sync.py

      - name: Commit updated state
        run: |
          git config user.name "okpm-sync-bot"
          git config user.email "bot@okpm.local"
          git add state.json
          if git diff --cached --quiet; then
            echo "No state changes — skipping commit/push."
            exit 0
          fi
          git commit -m "chore: update sync state [skip ci]"
          git pull --rebase origin main
          git push